<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0c0a10" />
<title>STARSHIP · LANDING</title>
<style>
html,body{margin:0;height:100%;background:#0c0a10;color:#efe6d6;font-family:Bahnschrift,Segoe UI,sans-serif}
#c{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6}
.panel{width:min(640px,calc(100vw - 28px));padding:28px;background:rgba(16,12,18,.9);border:1px solid rgba(239,230,214,.14)}
.btn{appearance:none;border:0;background:#e8a23a;color:#1a1206;font:inherit;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:12px 22px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay" id="start">
  <div class="panel">
    <h1>STARSHIP · LANDING</h1>
    <p>Temporary restore — Redwake deploy pending. Use Drop to play Starship.</p>
    <button class="btn" id="flyBtn" type="button" onclick="if(window.startDrop)window.startDrop(event)">Drop</button>
  </div>
</div>
<div class="overlay" id="end" style="display:none"></div>
<div id="hud"></div>
<div id="fail"></div>
<div id="touch-ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="sl-game.js?v=a91c2d"></script>
</body>
</html>
